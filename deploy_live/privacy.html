<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7fbff">
  <title>TripTogether</title>
  <style>
    :root{font-family:Inter,"Noto Sans KR",system-ui,sans-serif;color:#13213c;background:#f7fbff}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));border-bottom:1px solid #dce4f1;background:rgba(255,255,255,.96)}a{color:#1555d8}select{min-height:42px;padding:7px 32px 7px 10px;border:1px solid #b9c7db;border-radius:6px;background:#fff;color:#13213c}main{width:min(820px,100%);margin:auto;padding:42px max(20px,env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}h1{margin:0 0 10px;font-size:clamp(32px,7vw,48px);line-height:1.15}h2{margin:34px 0 10px;font-size:21px}p,li{font-size:15px;line-height:1.75}.meta{color:#5a6880}.contact{margin-top:30px;padding:18px;border-left:4px solid #f5b51b;background:#fff}.actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}.actions a{min-height:44px;padding:11px 15px;border:1px solid #b9c7db;border-radius:6px;background:#fff;text-decoration:none;font-weight:700}.brand{font-weight:900;letter-spacing:0}.brand span{color:#1555d8}footer{margin-top:48px;padding-top:22px;border-top:1px solid #dce4f1;color:#5a6880;font-size:13px}@media(max-width:480px){header{align-items:flex-start}.brand{padding-top:10px}main{padding-top:30px}}
  </style>
</head>
<body>
  <header><div class="brand">Trip<span>Together</span></div><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option><option value="fr">Français</option><option value="zh">中文</option><option value="ja">日本語</option><option value="es">Español</option></select></header>
  <main><h1 id="title"></h1><p class="meta" id="updated"></p><p id="intro"></p><div id="sections"></div><div class="contact" id="contact"></div><div class="actions"><a id="homeLink" href="index.html"></a><a id="privacyLink" href="privacy.html"></a><a id="supportLink" href="support.html"></a></div><footer id="footer"></footer></main>
  <script>
  const EMAIL='wandersync-family-sharing@outlook.com';
  const content={
    ko:{common:{updated:'시행일: 2026년 7월 15일',home:'앱으로 돌아가기',privacy:'개인정보처리방침',support:'지원 센터',footer:'TripTogether · 여행 코스 계획 및 동행 매칭'},privacy:{title:'개인정보처리방침',intro:'TripTogether는 여행 일정 생성, 저장, 공유와 동행 매칭 기능을 제공합니다. 이 문서는 서비스에서 처리하는 정보와 사용자의 선택권을 설명합니다.',sections:[['처리하는 정보',['프로필의 닉네임, 사진, 연령대, 언어, 여행 성향과 동행 선호 정보는 기기에 저장됩니다.','사용자가 동행방을 만들거나 참여하면 방 정보, 공개 프로필, 채팅 메시지가 공유 서버에 저장됩니다.','피드백, 도시 추가 요청과 지원 문의 내용이 서버에 저장될 수 있습니다.','일정과 공유 링크에는 사용자가 선택한 도시, 기간, 숙소 및 취향이 포함될 수 있습니다.']],['이용 목적',['여행 일정과 경로를 생성하고 저장·공유하기 위해 사용합니다.','동행방과 채팅을 다른 사용자에게 제공하고 안전 문제를 처리하기 위해 사용합니다.','피드백 번역과 서비스 개선, 오류 대응을 위해 사용합니다.']],['외부 서비스',['Cloudflare는 API, 데이터베이스와 피드백 번역을 처리합니다. Surge는 정적 웹 파일을 제공합니다.','지도·경로·장소 정보를 위해 OpenStreetMap, OSRM, Wikipedia 및 연결된 교통 제공자에 요청할 수 있습니다. 각 서비스에는 자체 정책이 적용됩니다.']],['보관 및 삭제',['기기 정보는 사용자가 앱 데이터나 프로필을 초기화할 때까지 보관됩니다.','동행방과 채팅은 동행 날짜가 끝나면 서비스 정리 대상이 됩니다.','사용자는 자신이 작성한 피드백을 앱에서 수정하거나 삭제할 수 있습니다. 그 밖의 공유 데이터 삭제는 지원 센터로 요청할 수 있습니다.']],['보호와 공유',['전송은 HTTPS로 보호됩니다. TripTogether는 개인정보를 판매하지 않으며 광고 SDK를 포함하지 않습니다.','서비스 운영에 필요한 제공자 외에는 정보를 공유하지 않습니다.']],['아동',['동행 매칭 서비스는 만 18세 미만을 대상으로 하지 않습니다.']]],contact:'개인정보 문의 또는 삭제 요청: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'},support:{title:'TripTogether 지원',intro:'앱 사용, 데이터 삭제 또는 안전 문제를 알려주세요. 가능한 한 문제 화면과 발생 시간을 함께 보내주세요.',sections:[['도움을 받는 방법',['앱 홈의 피드백 기능으로 일반 의견을 보낼 수 있습니다.','앱이 열리지 않거나 개인정보·안전 문제가 있으면 아래 이메일로 문의하세요.']],['문의에 포함할 내용',['사용 중인 기기와 운영체제, 선택 언어','문제가 발생한 기능과 시간','공유 링크 문제라면 민감한 정보를 제거한 링크']],['긴급 안전 안내',['동행 중 즉각적인 위험이 있으면 앱 문의보다 현지 긴급기관에 먼저 연락하세요.','금전 요구나 외부 메신저 유도는 응하지 말고 관련 방과 메시지 정보를 신고해 주세요.']]],contact:'지원 이메일: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'}},
    en:{common:{updated:'Effective: July 15, 2026',home:'Return to app',privacy:'Privacy Policy',support:'Support Center',footer:'TripTogether · itinerary planning and companion matching'},privacy:{title:'Privacy Policy',intro:'TripTogether provides itinerary creation, saving, sharing, and companion matching. This policy explains what information is processed and the choices available to you.',sections:[['Information we process',['Profile details such as nickname, photo, age range, languages, travel style, and companion preferences are stored on your device.','When you create or join a companion room, room details, public profile information, and chat messages are stored on the shared service.','Feedback, city requests, and support messages may be stored on the service.','Itineraries and share links may contain selected cities, dates, lodging, and preferences.']],['How we use it',['To create, save, and share itineraries and routes.','To provide companion rooms and chat and respond to safety concerns.','To translate feedback, improve the service, and diagnose errors.']],['Service providers',['Cloudflare provides the API, database, and feedback translation. Surge serves static web files.','OpenStreetMap, OSRM, Wikipedia, and configured transport providers may receive place or route queries under their own policies.']],['Retention and deletion',['On-device information remains until you reset the profile or app data.','Companion rooms and chat become eligible for cleanup after the companion date ends.','You can edit or delete your own feedback in the app. Request deletion of other shared data through Support.']],['Security and sharing',['Data is transmitted over HTTPS. TripTogether does not sell personal data and includes no advertising SDK.','Information is shared only with providers needed to operate the service.']],['Children',['Companion matching is not intended for anyone under 18.']]],contact:'Privacy questions or deletion requests: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'},support:{title:'TripTogether Support',intro:'Contact us about app use, data deletion, or safety concerns. Include the affected screen and approximate time when possible.',sections:[['How to get help',['Use the feedback area on the app home screen for general comments.','If the app will not open or the issue concerns privacy or safety, email us below.']],['What to include',['Device and operating system, plus selected language','Feature and approximate time of the problem','For link issues, a link with sensitive information removed']],['Urgent safety',['If you are in immediate danger while meeting a companion, contact local emergency services first.','Do not respond to money requests or pressure to move to an external messenger; report the room and relevant message details.']]],contact:'Support email: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'}},
    fr:{common:{updated:'Entrée en vigueur : 15 juillet 2026',home:"Retour à l’application",privacy:'Politique de confidentialité',support:"Centre d’assistance",footer:"TripTogether · itinéraires et compagnons de voyage"},privacy:{title:'Politique de confidentialité',intro:'TripTogether permet de créer, enregistrer et partager des itinéraires et de rechercher des compagnons. Cette politique décrit les données traitées et vos choix.',sections:[['Données traitées',['Le profil et les préférences sont conservés sur votre appareil.','Les salons, profils publics et messages de discussion sont enregistrés sur le service partagé.','Les avis, demandes de ville, itinéraires et liens partagés peuvent être traités.']],['Utilisation',['Créer et partager des itinéraires, fournir les salons et la discussion, traduire les avis et améliorer le service.']],['Prestataires',['Cloudflare fournit l’API, la base de données et la traduction ; Surge sert les fichiers. OpenStreetMap, OSRM, Wikipedia et les prestataires de transport peuvent recevoir des requêtes.']],['Conservation et suppression',['Les données locales restent jusqu’à la réinitialisation. Les salons expirent après la date du voyage. Vous pouvez supprimer vos avis ou demander la suppression via l’assistance.']],['Protection',['Les transferts utilisent HTTPS. Aucune vente de données ni SDK publicitaire.']],['Mineurs',['La mise en relation n’est pas destinée aux moins de 18 ans.']]],contact:'Confidentialité ou suppression : <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'},support:{title:'Assistance TripTogether',intro:'Signalez un problème d’utilisation, de confidentialité, de suppression ou de sécurité.',sections:[['Obtenir de l’aide',['Utilisez les avis dans l’accueil ou écrivez-nous ci-dessous.']],['À préciser',['Appareil, système, langue, fonction concernée et heure approximative.']],['Urgence',['En cas de danger immédiat, contactez d’abord les services d’urgence locaux. Ne répondez pas aux demandes d’argent.']]],contact:'E-mail : <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'}},
    zh:{common:{updated:'生效日期：2026年7月15日',home:'返回应用',privacy:'隐私政策',support:'支持中心',footer:'TripTogether · 行程规划与结伴旅行'},privacy:{title:'隐私政策',intro:'TripTogether提供行程创建、保存、分享和结伴功能。本政策说明我们处理的信息及您的选择。',sections:[['处理的信息',['昵称、头像、年龄段、语言和旅行偏好保存在设备上。','结伴房间、公开资料和聊天消息保存在共享服务中。','反馈、城市请求、行程和分享链接可能被处理。']],['使用目的',['生成和分享行程、提供结伴与聊天、翻译反馈并改进服务。']],['服务提供商',['Cloudflare提供API、数据库和翻译；Surge提供静态文件。OpenStreetMap、OSRM、Wikipedia及交通服务可能收到地点或路线查询。']],['保留与删除',['本地数据保留至您重置应用。结伴日期结束后房间可被清理。您可删除自己的反馈，或通过支持中心申请删除其他共享数据。']],['安全与共享',['使用HTTPS传输。不出售个人信息，也不包含广告SDK。']],['未成年人',['结伴功能不面向18岁以下用户。']]],contact:'隐私或删除请求：<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'},support:{title:'TripTogether支持',intro:'如遇应用使用、数据删除、隐私或安全问题，请联系我们。',sections:[['获取帮助',['一般建议可使用首页反馈；应用无法打开时请发送邮件。']],['请提供',['设备、系统、语言、相关功能和大致时间。']],['紧急安全',['如有即时危险，请先联系当地紧急机构。不要回应金钱要求或转移到外部聊天工具的压力。']]],contact:'支持邮箱：<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'}},
    ja:{common:{updated:'施行日：2026年7月15日',home:'アプリに戻る',privacy:'プライバシーポリシー',support:'サポートセンター',footer:'TripTogether · 旅程作成と同行者マッチング'},privacy:{title:'プライバシーポリシー',intro:'TripTogetherは旅程の作成・保存・共有と同行者マッチングを提供します。本ポリシーでは処理する情報と選択肢を説明します。',sections:[['処理する情報',['ニックネーム、写真、年代、言語、旅行の好みは端末に保存されます。','同行ルーム、公開プロフィール、チャットは共有サービスに保存されます。','フィードバック、都市リクエスト、旅程、共有リンクが処理される場合があります。']],['利用目的',['旅程の作成と共有、同行ルームとチャットの提供、フィードバック翻訳、サービス改善に利用します。']],['事業者',['CloudflareがAPI・データベース・翻訳、Surgeが静的配信を担当します。OpenStreetMap、OSRM、Wikipedia、交通事業者へ検索情報が送られる場合があります。']],['保存と削除',['端末データはリセットまで保存されます。同行日終了後、ルームは削除対象です。自分のフィードバックは削除でき、その他はサポートへ依頼できます。']],['安全',['HTTPSを使用し、個人情報の販売や広告SDKはありません。']],['未成年',['同行者マッチングは18歳未満を対象としていません。']]],contact:'プライバシー・削除依頼：<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'},support:{title:'TripTogetherサポート',intro:'アプリ、データ削除、プライバシー、安全上の問題についてお問い合わせください。',sections:[['問い合わせ方法',['一般的な意見はホームのフィードバック、起動できない場合はメールをご利用ください。']],['記載事項',['端末、OS、言語、機能、発生時刻。']],['緊急時',['危険が迫っている場合は現地の緊急機関へ先に連絡してください。金銭要求には応じないでください。']]],contact:'サポートメール：<a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'}},
    es:{common:{updated:'Vigente desde el 15 de julio de 2026',home:'Volver a la app',privacy:'Política de privacidad',support:'Centro de ayuda',footer:'TripTogether · itinerarios y compañeros de viaje'},privacy:{title:'Política de privacidad',intro:'TripTogether permite crear, guardar y compartir itinerarios y buscar compañeros. Esta política explica los datos tratados y tus opciones.',sections:[['Información tratada',['El perfil y las preferencias se guardan en el dispositivo.','Las salas, perfiles públicos y mensajes se guardan en el servicio compartido.','Se pueden tratar comentarios, solicitudes de ciudades, itinerarios y enlaces.']],['Uso',['Crear y compartir rutas, ofrecer salas y chat, traducir comentarios y mejorar el servicio.']],['Proveedores',['Cloudflare ofrece API, base de datos y traducción; Surge sirve archivos. OpenStreetMap, OSRM, Wikipedia y proveedores de transporte pueden recibir consultas.']],['Conservación y eliminación',['Los datos locales siguen hasta restablecer la app. Las salas se limpian tras la fecha del viaje. Puedes eliminar tus comentarios o pedir la eliminación al soporte.']],['Seguridad',['Se usa HTTPS. No vendemos datos ni incluimos SDK publicitarios.']],['Menores',['La búsqueda de compañeros no está dirigida a menores de 18 años.']]],contact:'Privacidad o eliminación: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'},support:{title:'Ayuda de TripTogether',intro:'Contacta por uso de la app, eliminación de datos, privacidad o seguridad.',sections:[['Cómo obtener ayuda',['Usa los comentarios de la página principal o escribe al correo indicado.']],['Qué incluir',['Dispositivo, sistema, idioma, función y hora aproximada.']],['Seguridad urgente',['Ante peligro inmediato, contacta primero con emergencias locales. No respondas a solicitudes de dinero.']]],contact:'Correo de soporte: <a href="mailto:'+EMAIL+'">'+EMAIL+'</a>'}}
  };
  const supported=['ko','en','fr','zh','ja','es'];
  const pageType=location.pathname.toLowerCase().includes('support')?'support':'privacy';
  const stored=localStorage.getItem('wander_lang');
  const requested=new URLSearchParams(location.search).get('lang');
  let lang=supported.includes(requested)?requested:(supported.includes(stored)?stored:(supported.includes(navigator.language.slice(0,2))?navigator.language.slice(0,2):'en'));
  function render(){const selected=content[lang],page=selected[pageType];document.documentElement.lang=lang;document.title=page.title+' · TripTogether';document.getElementById('language').value=lang;document.getElementById('title').textContent=page.title;document.getElementById('updated').textContent=selected.common.updated;document.getElementById('intro').textContent=page.intro;document.getElementById('sections').innerHTML=page.sections.map(([heading,items])=>'<section><h2>'+heading+'</h2><ul>'+items.map(item=>'<li>'+item+'</li>').join('')+'</ul></section>').join('');document.getElementById('contact').innerHTML=page.contact;document.getElementById('homeLink').textContent=selected.common.home;document.getElementById('privacyLink').textContent=selected.common.privacy;document.getElementById('supportLink').textContent=selected.common.support;document.getElementById('footer').textContent=selected.common.footer;document.getElementById('privacyLink').href='privacy.html?lang='+lang;document.getElementById('supportLink').href='support.html?lang='+lang;}
  document.getElementById('language').addEventListener('change',event=>{lang=event.target.value;localStorage.setItem('wander_lang',lang);render();});render();
  </script>
</body>
</html>
